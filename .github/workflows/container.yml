name: container

on:
  pull_request:
  push:
    branches: [main]
    # Release tags drive the publish + evidence-commit jobs below. Those jobs
    # are `if`-gated to `refs/tags/`, so PR and branch pushes never publish.
    tags: ["v*"]
  workflow_dispatch:

# Least privilege for the default jobs. The publish and record-evidence jobs
# raise their own scopes locally; nothing here can push a package or write the
# tree.
permissions:
  contents: read

jobs:
  report-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Run report and browser acceptance tests
        # Not the default shell: that is `bash -e`, without pipefail, and the
        # pipe below would then hide unittest's own exit status behind grep's.
        shell: bash
        run: |
          # `unittest discover` exits 0 when it collects nothing, so a renamed
          # or moved test path greens this job having run no test at all. The
          # summary line must report at least one test. Not `grep -q`: it exits
          # on the first match and SIGPIPEs the run it is measuring.
          python -m unittest discover -s tests -v 2>&1 | tee /dev/stderr | grep -E '^Ran [1-9][0-9]* tests? in ' > /dev/null \
            || { echo "::error::Acceptance suite failed, or collected zero tests (no 'Ran N tests' summary). Zero collected is a failure, not a pass."; exit 1; }

      # Not collected by `unittest discover`, so it needs its own step or it
      # only ever runs when someone remembers. Needs full history: it diffs the
      # working tree against a base revision.
      - name: Redaction differential gate
        env:
          # Through env, not inline `${{ github.event... }}` in the script body:
          # event fields never become shell source text.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          # Measure against what this change is actually built on. Pinning the
          # script's default would compare against an ever-staler revision as
          # main moves, which is the failure `--base` exists to prevent. A
          # positional offset is no better: `HEAD~1` measures only the last
          # commit of a branch, and on a shallow clone or a first commit it can
          # resolve to HEAD itself -- the differential then compares a revision
          # with itself, finds no regression by construction, and passes.
          #
          # The base per trigger, which is all three this workflow declares:
          #   pull_request     the PR's base sha, so the whole branch is measured.
          #   push             filtered to `branches: [main]`, so the merge-base
          #                    is always HEAD and the only usable base is the
          #                    pre-push tip. An all-zeros `before` (first push,
          #                    or a force-push) names no such tip.
          #   workflow_dispatch  no event range at all: the merge-base with the
          #                    default branch, which on main is HEAD itself.
          # The two shapes that name no distinct base -- an all-zeros push and a
          # dispatch from the default branch -- are the environment saying there
          # is nothing to measure, not a regression. They report that and pass.
          # An UNEXPECTED unresolvable base still fails: a gate that cannot fail
          # is the defect this step exists to close.
          head="$(git rev-parse --verify HEAD^{commit})"
          zero="0000000000000000000000000000000000000000"
          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              if [ -z "$base" ] || [ "$base" = "$zero" ]; then
                echo "::notice::Redaction differential gate: NOT MEASURED. This push reports no previous tip (before='$base'), which is a first push or a force-push, so there is no base revision to measure this working tree against."
                exit 0
              fi
              ;;
            *)
              base="$(git merge-base origin/main HEAD 2>/dev/null || git merge-base main HEAD 2>/dev/null || true)"
              if [ -n "$base" ] && [ "$base" = "$head" ]; then
                echo "::notice::Redaction differential gate: NOT MEASURED. ${GITHUB_EVENT_NAME:-this event} carries no changed range, and HEAD is already on the default branch, so the merge-base is HEAD itself and there is nothing to measure against."
                exit 0
              fi
              ;;
          esac
          resolved="$(git rev-parse --verify --quiet "${base}^{commit}" || true)"
          if [ -z "$resolved" ] || [ "$resolved" = "$head" ]; then
            echo "::error::Redaction differential gate: base '$base' is empty, is not a commit, or equals HEAD ($head). A base equal to HEAD makes the differential unable to fail, so this is an environment failure, not a pass. Check that the checkout has full history (fetch-depth: 0) and that origin/main was fetched." >&2
            exit 1
          fi
          echo "redaction differential: base=$resolved head=$head"
          # 0 measured and clean, 1 a redaction regression, 3 the base carries
          # an identical kali_pentest_server.py so there was nothing to measure
          # (every docs-only, tests-only or workflow-only change). Anything else
          # -- 2 included -- is a failure.
          #
          # 3 and not 2 because 2 is not a status only this script can produce:
          # CPython exits 2 when it cannot open the script file, and argparse
          # exits 2 on any usage error. Treating 2 as "nothing to measure"
          # greens this gate on a deleted or renamed differential, and prints a
          # notice asserting a reason that is false. Nothing produces 3 but the
          # script saying so itself.
          #
          # 3 passes, but never silently: a green log that does not say the gate
          # measured nothing is the same silent pass as a vacuous base.
          status=0
          python3 tests/redaction_differential.py --base "$resolved" || status=$?
          if [ "$status" = "3" ]; then
            echo "::notice::Redaction differential gate: NOT MEASURED. Base $resolved carries the same kali_pentest_server.py as the working tree, so this change alters no redaction behaviour and the differential had nothing to compare."
            exit 0
          fi
          exit "$status"

  build-and-smoke:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: kali-mcp:smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      - name: Verify locked image
        run: docker run --rm --platform "${{ matrix.platform }}" --security-opt=no-new-privileges --entrypoint verify-kali-mcp-image kali-mcp:smoke
      - name: Run hermetic container integration gate
        run: python3 tests/integration/run_container_integration.py --image kali-mcp:smoke --platform "${{ matrix.platform }}"
      - name: Record package, image, and capability evidence
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          platform_name="${PLATFORM//\//-}"
          docker image inspect kali-mcp:smoke > "release-evidence/${platform_name}-image.json"
          docker run --rm --platform "$PLATFORM" --entrypoint dpkg-query kali-mcp:smoke -W '-f=${Package}\t${Version}\t${Architecture}\n' > "release-evidence/${platform_name}-packages.tsv"
          # #65: record the effective capability set observed under the SAME
          # hardened flags the launcher applies (cap-drop=ALL, no-new-privileges,
          # read-only). The integration gate above asserts this is empty; this
          # step captures the observation as a durable, reviewable artifact.
          # An empty set prints as 0000000000000000.
          docker run --rm --platform "$PLATFORM" \
            --security-opt=no-new-privileges --cap-drop=ALL --read-only \
            --entrypoint awk kali-mcp:smoke \
            '/^CapEff:/ { print $2 }' /proc/self/status \
            > "release-evidence/${platform_name}-capeff.txt"
          echo "CapEff ($platform_name): $(cat "release-evidence/${platform_name}-capeff.txt")"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ strategy.job-index }}
          path: release-evidence/

  # ---- Release publish (#12 AC5, #62, #63) --------------------------------
  # Runs ONLY on a release tag, after both platform smoke builds pass. Holds
  # the publish scopes; no other job can push a package or mint an attestation.
  publish:
    needs: build-and-smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push image to GHCR (#63)
      id-token: write       # OIDC keyless attestation (#63)
      attestations: write   # record the provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image is created private by GHCR default while the package has no
      # explicit visibility; #62 chose private. The multi-arch digest is the
      # immutable release identity (#12 AC5). provenance+sbom attach in-registry
      # attestations; the OIDC-signed provenance below adds a Sigstore record.
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      - name: Attest build provenance (OIDC keyless)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf 'ghcr.io/%s@%s\ntag: %s\n' "$GITHUB_REPOSITORY" "$DIGEST" "$REF_NAME"

  # ---- Durable evidence (#64, #65) ----------------------------------------
  # On a release tag, gather the per-platform evidence the smoke builds produced
  # and open a PR that commits it under release-evidence/<tag>/. CI never pushes
  # to a protected branch directly; a maintainer merges the PR (dev -> PR -> merge).
  record-evidence:
    needs: build-and-smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the evidence branch
      pull-requests: write    # open the PR
    steps:
      - uses: actions/checkout@v4
      - name: Download evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          path: _evidence
          merge-multiple: true
      - name: Open evidence PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # REF_NAME is attacker-influenceable (whoever pushes the tag), so it
          # only ever reaches git/gh as an argument, never interpolated into a
          # script body, and is constrained to a release-tag shape first.
          case "$REF_NAME" in
            v[0-9]*) : ;;
            *) echo "::error::record-evidence expects a v* release tag, got '$REF_NAME'"; exit 1 ;;
          esac
          dest="release-evidence/$REF_NAME"
          mkdir -p "$dest"
          cp -a _evidence/. "$dest"/
          rm -rf _evidence
          if git diff --quiet -- "$dest"; then
            echo "::notice::No new evidence for $REF_NAME; nothing to commit."
            exit 0
          fi
          branch="release-evidence/$REF_NAME"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$dest"
          git commit -m "chore(release-evidence): record $REF_NAME package, image, and CapEff evidence"
          git push --set-upstream origin "$branch"
          gh pr create --fill --base main --head "$branch" \
            --title "release-evidence: $REF_NAME" \
            --body "Automated: durable package, image, and CapEff evidence for release $REF_NAME (#64, #65)."
