name: container

on:
  pull_request:
  push:
    branches: [main]
    # A v* tag PUSH drives the publish + evidence-commit jobs below. Those jobs
    # gate on event_name == 'push' AND refs/tags/v*, so neither a PR, a branch
    # push, nor a workflow_dispatch at an arbitrary ref can publish.
    tags: ["v*"]
  workflow_dispatch:

# Least privilege for the default jobs. The publish and record-evidence jobs
# raise their own scopes locally; nothing here can push a package or write the
# tree.
permissions:
  contents: read

jobs:
  report-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Run report and browser acceptance tests
        # Not the default shell: that is `bash -e`, without pipefail, and the
        # pipe below would then hide unittest's own exit status behind grep's.
        shell: bash
        run: |
          # `unittest discover` exits 0 when it collects nothing, so a renamed
          # or moved test path greens this job having run no test at all. The
          # summary line must report at least one test. Not `grep -q`: it exits
          # on the first match and SIGPIPEs the run it is measuring.
          python -m unittest discover -s tests -v 2>&1 | tee /dev/stderr | grep -E '^Ran [1-9][0-9]* tests? in ' > /dev/null \
            || { echo "::error::Acceptance suite failed, or collected zero tests (no 'Ran N tests' summary). Zero collected is a failure, not a pass."; exit 1; }

      # Not collected by `unittest discover`, so it needs its own step or it
      # only ever runs when someone remembers. Needs full history: it diffs the
      # working tree against a base revision.
      - name: Redaction differential gate
        env:
          # Through env, not inline `${{ github.event... }}` in the script body:
          # event fields never become shell source text.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          # Measure against what this change is actually built on. Pinning the
          # script's default would compare against an ever-staler revision as
          # main moves, which is the failure `--base` exists to prevent. A
          # positional offset is no better: `HEAD~1` measures only the last
          # commit of a branch, and on a shallow clone or a first commit it can
          # resolve to HEAD itself -- the differential then compares a revision
          # with itself, finds no regression by construction, and passes.
          #
          # The base per trigger, which is all three this workflow declares:
          #   pull_request     the PR's base sha, so the whole branch is measured.
          #   push             filtered to `branches: [main]`, so the merge-base
          #                    is always HEAD and the only usable base is the
          #                    pre-push tip. An all-zeros `before` (first push,
          #                    or a force-push) names no such tip.
          #   workflow_dispatch  no event range at all: the merge-base with the
          #                    default branch, which on main is HEAD itself.
          # The two shapes that name no distinct base -- an all-zeros push and a
          # dispatch from the default branch -- are the environment saying there
          # is nothing to measure, not a regression. They report that and pass.
          # An UNEXPECTED unresolvable base still fails: a gate that cannot fail
          # is the defect this step exists to close.
          head="$(git rev-parse --verify HEAD^{commit})"
          zero="0000000000000000000000000000000000000000"
          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              if [ -z "$base" ] || [ "$base" = "$zero" ]; then
                echo "::notice::Redaction differential gate: NOT MEASURED. This push reports no previous tip (before='$base'), which is a first push or a force-push, so there is no base revision to measure this working tree against."
                exit 0
              fi
              ;;
            *)
              base="$(git merge-base origin/main HEAD 2>/dev/null || git merge-base main HEAD 2>/dev/null || true)"
              if [ -n "$base" ] && [ "$base" = "$head" ]; then
                echo "::notice::Redaction differential gate: NOT MEASURED. ${GITHUB_EVENT_NAME:-this event} carries no changed range, and HEAD is already on the default branch, so the merge-base is HEAD itself and there is nothing to measure against."
                exit 0
              fi
              ;;
          esac
          resolved="$(git rev-parse --verify --quiet "${base}^{commit}" || true)"
          if [ -z "$resolved" ] || [ "$resolved" = "$head" ]; then
            echo "::error::Redaction differential gate: base '$base' is empty, is not a commit, or equals HEAD ($head). A base equal to HEAD makes the differential unable to fail, so this is an environment failure, not a pass. Check that the checkout has full history (fetch-depth: 0) and that origin/main was fetched." >&2
            exit 1
          fi
          echo "redaction differential: base=$resolved head=$head"
          # 0 measured and clean, 1 a redaction regression, 3 the base carries
          # an identical kali_pentest_server.py so there was nothing to measure
          # (every docs-only, tests-only or workflow-only change). Anything else
          # -- 2 included -- is a failure.
          #
          # 3 and not 2 because 2 is not a status only this script can produce:
          # CPython exits 2 when it cannot open the script file, and argparse
          # exits 2 on any usage error. Treating 2 as "nothing to measure"
          # greens this gate on a deleted or renamed differential, and prints a
          # notice asserting a reason that is false. Nothing produces 3 but the
          # script saying so itself.
          #
          # 3 passes, but never silently: a green log that does not say the gate
          # measured nothing is the same silent pass as a vacuous base.
          status=0
          python3 tests/redaction_differential.py --base "$resolved" || status=$?
          if [ "$status" = "3" ]; then
            echo "::notice::Redaction differential gate: NOT MEASURED. Base $resolved carries the same kali_pentest_server.py as the working tree, so this change alters no redaction behaviour and the differential had nothing to compare."
            exit 0
          fi
          exit "$status"

  build-and-smoke:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: kali-mcp:smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      - name: Verify locked image
        run: docker run --rm --platform "${{ matrix.platform }}" --security-opt=no-new-privileges --entrypoint verify-kali-mcp-image kali-mcp:smoke
      - name: Run hermetic container integration gate
        run: python3 tests/integration/run_container_integration.py --image kali-mcp:smoke --platform "${{ matrix.platform }}"
      # Pre-publish signal only. The DURABLE, committed release evidence is
      # captured from the PUBLISHED digest in the publish job below, not here:
      # this smoke image is a separate build from the one that ships.
      - name: Record smoke package, image, and capability signal
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p smoke-evidence
          platform_name="${PLATFORM//\//-}"
          docker image inspect kali-mcp:smoke > "smoke-evidence/${platform_name}-image.json"
          docker run --rm --platform "$PLATFORM" --entrypoint dpkg-query kali-mcp:smoke -W '-f=${Package}\t${Version}\t${Architecture}\n' > "smoke-evidence/${platform_name}-packages.tsv"
          # CapEff observed under the SAME hardened flags the launcher applies
          # (cap-drop=ALL, no-new-privileges, read-only). Empty set = 0000...0000.
          docker run --rm --platform "$PLATFORM" \
            --security-opt=no-new-privileges --cap-drop=ALL --read-only \
            --entrypoint awk kali-mcp:smoke \
            '/^CapEff:/ { print $2 }' /proc/self/status \
            > "smoke-evidence/${platform_name}-capeff.txt"
          echo "CapEff ($platform_name): $(cat "smoke-evidence/${platform_name}-capeff.txt")"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ strategy.job-index }}
          path: smoke-evidence/

  # ---- Release publish (#12 AC2/AC5, #62, #63) ----------------------------
  # Runs ONLY on a real v* release-tag PUSH, after the acceptance/redaction
  # gates (report-browser) AND both platform smoke builds pass. `if` is scoped
  # to event_name == 'push' so a workflow_dispatch pointed at an arbitrary tag
  # ref cannot reach the elevated scopes. Holds the publish scopes; no other
  # job can push a package or mint an attestation.
  publish:
    needs: [report-browser, build-and-smoke]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push image to GHCR (#63)
      id-token: write       # OIDC keyless attestation (#63)
      attestations: write   # required by actions/attest-build-provenance (#63)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The multi-arch manifest-list digest is the immutable release identity
      # (#12 AC5). sbom:true attaches a BuildKit SBOM attestation; provenance is
      # supplied by the OIDC-signed attest step below (buildkit provenance is
      # unsigned, so it is left off rather than double-attesting).
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: false
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      - name: Attest build provenance (OIDC keyless)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # #62: the package must be PRIVATE. First publication from a private repo
      # is private by default, but that is not guaranteed if the package already
      # existed public, so assert it rather than assume. Fails the release if the
      # published package is not private.
      - name: Assert GHCR package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          vis="$(gh api "/users/$OWNER/packages/container/kali-mcp-server" --jq .visibility)"
          echo "GHCR package visibility: $vis"
          if [ "$vis" != "private" ]; then
            echo "::error::GHCR package kali-mcp-server is '$vis', expected 'private' (#62). Set the package visibility to private and re-release."
            exit 1
          fi
      # #12 AC2 + #64 + #65: capture the DURABLE release evidence from the object
      # that actually shipped (the published digest), not the earlier smoke build.
      # Verify each published platform against the package lock, and record its
      # packages and effective capability set.
      - name: Verify and record published-image evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          dest="release-evidence/${REF_NAME}"
          mkdir -p "$dest"
          printf 'ghcr.io/%s@%s\ntag: %s\n' "$GITHUB_REPOSITORY" "$DIGEST" "$REF_NAME" > "$dest/published-image.txt"
          for platform in linux/amd64 linux/arm64; do
            pname="${platform//\//-}"
            docker pull --platform "$platform" "$ref"
            # AC2: verify the PUBLISHED image against the pinned package lock.
            docker run --rm --platform "$platform" --security-opt=no-new-privileges \
              --entrypoint verify-kali-mcp-image "$ref"
            docker run --rm --platform "$platform" --entrypoint dpkg-query "$ref" \
              -W '-f=${Package}\t${Version}\t${Architecture}\n' > "$dest/${pname}-packages.tsv"
            # #65: CapEff of the shipped image under the launcher's hardened flags.
            docker run --rm --platform "$platform" \
              --security-opt=no-new-privileges --cap-drop=ALL --read-only \
              --entrypoint awk "$ref" '/^CapEff:/ { print $2 }' /proc/self/status \
              > "$dest/${pname}-capeff.txt"
            echo "published $pname CapEff: $(cat "$dest/${pname}-capeff.txt")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-published
          path: release-evidence/

  # ---- Durable evidence commit (#64, #65) ---------------------------------
  # Commits the published-image evidence captured above under
  # release-evidence/<tag>/ via a PR. CI never pushes to main directly; a
  # maintainer merges (dev -> PR -> merge). Gated the same way as publish.
  record-evidence:
    needs: [publish]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the evidence branch
      pull-requests: write    # open the PR
    steps:
      - uses: actions/checkout@v4
      - name: Download published evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-published
          path: release-evidence
      - name: Open evidence PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # REF_NAME is attacker-influenceable, so it only reaches git/gh as an
          # argument, never interpolated into a script body, and is constrained
          # to a release-tag shape first.
          case "$REF_NAME" in
            v[0-9]*) : ;;
            *) echo "::error::record-evidence expects a v* release tag, got '$REF_NAME'"; exit 1 ;;
          esac
          dest="release-evidence/$REF_NAME"
          branch="release-evidence/$REF_NAME"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$dest"
          # Stage first, THEN check: git diff on the working tree does not see
          # newly-added untracked files, so the emptiness test must run against
          # the index (--cached) or it always reports "nothing to commit".
          if git diff --cached --quiet -- "$dest"; then
            echo "::notice::No evidence changes for $REF_NAME; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release-evidence): record $REF_NAME package, image, and CapEff evidence"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "release-evidence: $REF_NAME" \
            --body "Automated: durable package, image, and CapEff evidence for the published $REF_NAME digest (#64, #65)."
